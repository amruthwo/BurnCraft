# Builds BurnCraft for every platform and attaches installers to a GitHub release.
# Runs on tags like v0.1.0, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, arch: x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, arch: arm64 }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-24.04, arch: riscv64, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross, via cargo-zigbuild)
        if: ${{ matrix.cross }}
        run: |
          # Ubuntu 24.04 blocks system-wide pip installs; this runner is throwaway, so allow it
          pip install --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target ${{ matrix.target }}
      - name: Portable tarball
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/burncraft-linux-${{ matrix.arch }}.tar.gz burncraft
      - name: .deb, .rpm, .AppImage
        if: ${{ !matrix.cross }}
        run: |
          # the AppImage tools are themselves AppImages and need FUSE 2, which Ubuntu 24.04 leaves out
          sudo apt-get update && sudo apt-get install -y libfuse2t64
          cargo install cargo-packager cargo-generate-rpm --locked
          cargo packager --release --formats deb,appimage --target ${{ matrix.target }} || true
          cargo generate-rpm --target ${{ matrix.target }} -o dist/ || true
          find target -maxdepth 4 \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp -n {} dist/ \;
      # files only: packaging leaves work folders (AppDirs) in dist/ that shouldn't be uploaded
      - uses: actions/upload-artifact@v4
        with:
          name: "linux-${{ matrix.arch }}"
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: burncraft.flatpak
          manifest-path: packaging/flatpak/org.burncraft.BurnCraft.yml

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - name: .msi and setup .exe
        run: |
          cargo install cargo-packager --locked
          cargo packager --release --formats wix,nsis --target ${{ matrix.target }}
        continue-on-error: true
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive target/${{ matrix.target }}/release/burncraft.exe dist/burncraft-windows-${{ matrix.arch }}-portable.zip
          # the packager already writes to dist/; only pick up installers left under target/
          Get-ChildItem -Recurse -Include *.msi,*-setup.exe target -ErrorAction SilentlyContinue | Copy-Item -Destination dist -Force
      - uses: actions/upload-artifact@v4
        with:
          name: "windows-${{ matrix.arch }}"
          path: |
            dist/*.zip
            dist/*.msi
            dist/*-setup.exe

  # One universal app (Apple Silicon + Intel), packed as .dmg and as a zipped .app.
  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Universal BurnCraft.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=dist/BurnCraft.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/burncraft" \
            target/aarch64-apple-darwin/release/burncraft target/x86_64-apple-darwin/release/burncraft
          lipo -info "$APP/Contents/MacOS/burncraft"
          cp packaging/icons/burncraft.icns "$APP/Contents/Resources/burncraft.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>BurnCraft</string>
            <key>CFBundleDisplayName</key><string>BurnCraft</string>
            <key>CFBundleIdentifier</key><string>org.burncraft.BurnCraft</string>
            <key>CFBundleExecutable</key><string>burncraft</string>
            <key>CFBundleIconFile</key><string>burncraft.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.graphics-design</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>LightBurn project</string>
              <key>CFBundleTypeExtensions</key><array><string>lbrn2</string><string>lbrn</string></array>
              <key>CFBundleTypeRole</key><string>Editor</string>
            </dict></array>
          </dict></plist>
          EOF
          # ad-hoc signature so Apple Silicon will run it (not notarised: right-click > Open the first time)
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname BurnCraft -srcfolder "$APP" -ov -format UDZO "dist/BurnCraft-$VERSION-macos-universal.dmg"
          (cd dist && ditto -c -k --keepParent BurnCraft.app "BurnCraft-$VERSION-macos-universal.app.zip")
          rm -rf "$APP"
      - uses: actions/upload-artifact@v4
        with: { name: "macos-universal", path: dist/* }

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install trunk --locked
      - run: trunk build --release --public-url ./ web/index.html --dist dist/web
      - run: cd dist && zip -r burncraft-web.zip web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/burncraft-web.zip }

  # Publishes whatever was built, even if some jobs failed (missing files can be uploaded by hand).
  release:
    needs: [linux, flatpak, windows, macos, web]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
